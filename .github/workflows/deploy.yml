name: Deploy GasTracker App
    
on:
  push:
    branches: [ "dev" ]
    
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
    
      - name: Lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
    
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME_LOWER }}:latest,ghcr.io/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
          build-args: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
    
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
    
      - name: Docker Deploy
        run: |
          # Set the environment variable for the image tag used in docker-compose.yaml
          # We use the specific commit SHA for a precise deployment
          export IMAGE_NAME_WITH_TAG=$(echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "Deploying image: $IMAGE_NAME_WITH_TAG"
    
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              
          cd $GITHUB_WORKSPACE
              
          # Pull the latest version of the image specified in the compose file (via the env var)
          docker compose pull
          # Start the services with the new image
          docker compose up -d --remove-orphans
          # Clean up old, unused images
          docker image prune -f